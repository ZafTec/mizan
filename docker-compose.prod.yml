# Production deployment on the existing proxy and PostgreSQL networks.
# Stop the old Mizan services before this cutover. The upgrade service takes
# a complete backup and applies the reviewed v1 bridge before any app starts.
# Provision .env, private .env.migration (PG* only), deployment/, and backups/
# beside this file. Public frontend URLs are GitHub build-time variables.

services:
  mizan-db-upgrade:
    image: postgres:18-alpine
    container_name: mizan-db-upgrade
    restart: "no"
    env_file:
      - .env.migration
    entrypoint: ["/bin/sh", "/upgrade/db-upgrade.sh"]
    volumes:
      - type: bind
        source: ./deployment/db-upgrade.sh
        target: /upgrade/db-upgrade.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deployment/v1-to-v2-upgrade.sql
        target: /upgrade/v1-to-v2-upgrade.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deployment/media-apply.sql
        target: /migration/media-apply.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./backups
        target: /backups
        bind:
          create_host_path: false
    networks:
      - postgresql-db-n8n

  mizan-backend:
    image: euaell/mizan-backend:latest
    container_name: mizan-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Storage__ServiceUrl: ${STORAGE_SERVICE_URL:?STORAGE_SERVICE_URL is required}
      Storage__Region: ${STORAGE_REGION:-us-east-1}
      Storage__AccessKeyId: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
      Storage__SecretAccessKey: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
      Storage__Bucket: ${STORAGE_BUCKET:-mizan}
      Storage__PublicBaseUrl: ${STORAGE_PUBLIC_BASE_URL:?STORAGE_PUBLIC_BASE_URL is required}
      # AI photo requests permit 8 MB; the storage limit must accommodate them.
      Storage__MaxUploadBytes: 8388608
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASS:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-${SMTP_FROM:-noreply@mizan.local}}
      Smtp__FromName: ${SMTP_FROM_NAME:-Mizan}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      Authentication__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      Ai__BaseUrl: ${AI_BASE_URL:-}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__Model: ${AI_MODEL:-gpt-5.6-luna}
      Ai__SupportsTemperature: ${AI_SUPPORTS_TEMPERATURE:-true}
      Ai__GlobalDailyTokens: ${AI_GLOBAL_DAILY_TOKENS:-5000000}
      Ai__GlobalDailyCostMicros: ${AI_GLOBAL_DAILY_COST_MICROS:-20000000}
    depends_on:
      mizan-db-upgrade:
        condition: service_completed_successfully
    networks:
      - proxy-net
      - postgresql-db-n8n
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 512M

  mizan-frontend:
    image: euaell/mizan-frontend:latest
    container_name: mizan-frontend
    restart: unless-stopped
    environment:
      API_URL: http://mizan-backend:8080
      BACKEND_API_URL: http://mizan-backend:8080
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is required}
    depends_on:
      mizan-db-upgrade:
        condition: service_completed_successfully
      mizan-backend:
        condition: service_healthy
    networks:
      - proxy-net
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M

  mizan-mcp:
    image: euaell/mizan-mcp:latest
    container_name: mizan-mcp
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      BACKEND_API_URL: http://mizan-backend:8080
      ConnectionStrings__PostgreSQL: ${ConnectionStrings__PostgreSQL:?ConnectionStrings__PostgreSQL is required}
      Mcp__ServiceApiKey: ${Mcp__ServiceApiKey:?Mcp__ServiceApiKey is required}
      Mcp__AdminServiceApiKey: ${Mcp__AdminServiceApiKey:?Mcp__AdminServiceApiKey is required}
      Mcp__Stateless: ${Mcp__Stateless:-false}
    depends_on:
      mizan-db-upgrade:
        condition: service_completed_successfully
      mizan-backend:
        condition: service_healthy
    networks:
      - proxy-net
      - postgresql-db-n8n
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          memory: 256M

networks:
  proxy-net:
    external: true
  postgresql-db-n8n:
    external: true
