name: CI/CD Pipeline

on:
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mizan
          POSTGRES_PASSWORD: mizan_test_password
          POSTGRES_DB: mizan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__PostgreSQL: "Host=localhost;Port=5432;Database=mizan_test;Username=mizan;Password=mizan_test_password"
      TEST_DB_CONNECTION: "Host=localhost;Port=5432;Database=mizan_test;Username=mizan;Password=mizan_test_password"
      ConnectionStrings__Redis: "localhost:6379"
      Mcp__ServiceApiKey: "test-api-key"
      Mcp__AdminServiceApiKey: "test-admin-api-key"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore backend/Mizan.sln

    - name: Build
      run: dotnet build backend/Mizan.sln --no-restore

    - name: Check that the EF model matches the migrations
      working-directory: backend
      run: |
        dotnet tool install --global dotnet-ef
        dotnet ef migrations has-pending-model-changes --no-build --project Mizan.Infrastructure --startup-project Mizan.Api

    - name: Check formatting
      run: dotnet format backend/Mizan.sln --verify-no-changes --no-restore

    - name: Test
      run: dotnet test backend/Mizan.sln --no-build --verbosity minimal --logger "console;verbosity=minimal" --nologo

    # Swashbuckle's CLI cannot host this API (Program.cs reads app.Urls after
    # the host is built), so the document comes from the running API, the same
    # source `bun run codegen` uses. Development enables /swagger and applies
    # migrations on startup.
    - name: Export OpenAPI document
      env:
        ASPNETCORE_ENVIRONMENT: Development
        ASPNETCORE_URLS: http://localhost:5000
      run: |
        dotnet run --project backend/Mizan.Api --no-build --no-launch-profile > "$RUNNER_TEMP/api.log" 2>&1 &
        api_pid=$!
        for attempt in $(seq 1 60); do
          if curl -fsS http://localhost:5000/swagger/v1/swagger.json -o "$RUNNER_TEMP/swagger.json"; then
            break
          fi
          if ! kill -0 "$api_pid" 2>/dev/null; then
            break
          fi
          sleep 2
        done
        kill "$api_pid" 2>/dev/null || true
        wait "$api_pid" 2>/dev/null || true
        if [ ! -s "$RUNNER_TEMP/swagger.json" ]; then
          echo "::error::The API did not serve /swagger/v1/swagger.json"
          cat "$RUNNER_TEMP/api.log"
          exit 1
        fi

    - name: Upload OpenAPI document
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: openapi
        path: ${{ runner.temp }}/swagger.json
        if-no-files-found: error
        retention-days: 1

  openapi-drift:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: frontend/.bun-version

    - name: Install dependencies
      working-directory: frontend
      run: bun install --frozen-lockfile

    - name: Download OpenAPI document
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: openapi
        path: ${{ runner.temp }}/openapi

    # Mirrors `bun run codegen` in frontend/package.json against the document
    # the API served, using the lockfile's openapi-typescript.
    - name: Check generated API types
      working-directory: frontend
      run: |
        bunx openapi-typescript "$RUNNER_TEMP/openapi/swagger.json" -o "$RUNNER_TEMP/api.generated.ts"
        if ! diff -u types/api.generated.ts "$RUNNER_TEMP/api.generated.ts"; then
          echo "::error file=frontend/types/api.generated.ts::types/api.generated.ts is out of date. Run the API, then \`bun run codegen\` in frontend, and commit the result."
          exit 1
        fi

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: frontend/.bun-version

    - name: Install dependencies
      working-directory: frontend
      run: bun install --frozen-lockfile

    - name: Run Lint
      working-directory: frontend
      run: bun run lint

    - name: Typecheck
      working-directory: frontend
      run: bun run typecheck

    - name: Check formatting
      working-directory: frontend
      run: bun run format:check

    - name: Unit tests
      working-directory: frontend
      run: bun run test

    - name: Build Frontend
      working-directory: frontend
      env:
        NEXT_PUBLIC_API_URL: "http://localhost:5000"
      run: bun run build

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: frontend/.bun-version

    - name: Install dependencies
      working-directory: frontend
      run: bun install --frozen-lockfile

    - name: Install Chromium
      working-directory: frontend
      run: bunx playwright install --with-deps chromium

    # With CI set, playwright.config.ts builds the app and serves the
    # standalone output instead of `next dev`.
    - name: End-to-end tests
      working-directory: frontend
      run: bun run test:e2e

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report
        path: |
          frontend/playwright-report
          frontend/test-results
        retention-days: 7
