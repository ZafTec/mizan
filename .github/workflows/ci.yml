name: CI/CD Pipeline

on:
  pull_request:
    branches: [ '*' ]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mizan
          POSTGRES_PASSWORD: mizan_test_password
          POSTGRES_DB: mizan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore backend/Mizan.sln

    - name: Build
      run: dotnet build backend/Mizan.sln --no-restore

    - name: Check that the EF model matches the migrations
      env:
        ConnectionStrings__PostgreSQL: "Host=localhost;Port=5432;Database=mizan_test;Username=mizan;Password=mizan_test_password"
        ConnectionStrings__Redis: "localhost:6379"
        Mcp__ServiceApiKey: "test-api-key"
        Mcp__AdminServiceApiKey: "test-admin-api-key"
      working-directory: backend
      run: |
        dotnet tool install --global dotnet-ef
        dotnet ef migrations has-pending-model-changes --no-build --project Mizan.Infrastructure --startup-project Mizan.Api

    - name: Test
      env:
        ConnectionStrings__PostgreSQL: "Host=localhost;Port=5432;Database=mizan_test;Username=mizan;Password=mizan_test_password"
        TEST_DB_CONNECTION: "Host=localhost;Port=5432;Database=mizan_test;Username=mizan;Password=mizan_test_password"
        ConnectionStrings__Redis: "localhost:6379"
        Mcp__ServiceApiKey: "test-api-key"
        Mcp__AdminServiceApiKey: "test-admin-api-key"
      run: dotnet test backend/Mizan.sln --no-build --verbosity minimal --logger "console;verbosity=minimal" --nologo

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      working-directory: frontend
      run: bun install --frozen-lockfile

    - name: Run Lint
      working-directory: frontend
      run: bun run lint

    - name: Unit tests
      working-directory: frontend
      run: bun run test

    - name: Build Frontend
      working-directory: frontend
      env:
        NEXT_PUBLIC_API_URL: "http://localhost:5000"
      run: bun run build

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      working-directory: frontend
      run: bun install --frozen-lockfile

    - name: Install Chromium
      working-directory: frontend
      run: bunx playwright install --with-deps chromium

    - name: Browser tests against the fixture API
      working-directory: frontend
      run: bun run test:e2e

    - name: Keep the report when something fails
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report
        retention-days: 7
