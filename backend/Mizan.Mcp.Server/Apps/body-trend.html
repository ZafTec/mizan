<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body trend</title>
<style>
:root { color-scheme: light dark; --ink: oklch(21% .007 78); --paper: oklch(98.5% .004 91); --card: #fff; --muted: oklch(43.65% .012 82); --rule: oklch(90.4% .013 87); --teal: oklch(49.3% .076 187); --warn: oklch(49.5% .142 31); --fill: oklch(93.5% .013 87); }
:root[data-theme="dark"], :root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: oklch(95.5% .007 89); --paper: oklch(17.2% .005 80); --card: oklch(21% .006 80); --muted: oklch(76.5% .021 88); --rule: oklch(30% .012 84); --teal: oklch(77.2% .097 186); --warn: oklch(71.3% .13 30); --fill: oklch(26% .01 84); } }
:root[data-theme="dark"] { --ink: oklch(95.5% .007 89); --paper: oklch(17.2% .005 80); --card: oklch(21% .006 80); --muted: oklch(76.5% .021 88); --rule: oklch(30% .012 84); --teal: oklch(77.2% .097 186); --warn: oklch(71.3% .13 30); --fill: oklch(26% .01 84); }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); font: 14px/20px system-ui, -apple-system, "Segoe UI", sans-serif; }
h1 { margin: 0 0 4px; font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -.01em; }
.sub { margin: 0 0 12px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 12px 14px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 3px; padding: 8px 12px; cursor: pointer; min-height: 36px; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
input, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 6px 8px; min-height: 36px; }
.num { font-variant-numeric: tabular-nums; }
.err { color: var(--warn); }
.muted { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1 id="title">Body measurements</h1>
<p class="sub" id="summary">Waiting for data…</p>
<div class="card" id="chart" hidden></div>
<div class="row" style="margin-top:12px" id="metrics" hidden></div>
<p id="message" class="muted" role="status"></p>
<script>
// Talks to the host over postMessage (MCP Apps). No libraries, so the page is one file.
const pending = new Map();
let nextId = 0;
const send = (message) => parent.postMessage(message, "*");
const request = (method, params) => new Promise((resolve, reject) => {
  const id = ++nextId;
  pending.set(id, { resolve, reject });
  send({ jsonrpc: "2.0", id, method, params });
});
const notify = (method, params) => send({ jsonrpc: "2.0", method, params: params || {} });
const callTool = (name, args) => request("tools/call", { name, arguments: args || {} });
const textOf = (result) => ((result && result.content) || []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
const jsonOf = (result) => { try { return JSON.parse(textOf(result)); } catch { return null; } };
const el = (tag, props, ...kids) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== undefined && value !== null && value !== false) node.setAttribute(key, value === true ? "" : value);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return node;
};
const reportSize = () => notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
const applyContext = (context) => { if (context && context.theme) document.documentElement.dataset.theme = context.theme; };
window.addEventListener("message", (event) => {
  const message = event.data;
  if (!message || message.jsonrpc !== "2.0") return;
  if (message.id !== undefined && !message.method) {
    const waiting = pending.get(message.id);
    if (!waiting) return;
    pending.delete(message.id);
    if (message.error) waiting.reject(new Error(message.error.message || "The request failed")); else waiting.resolve(message.result);
  } else if (message.method === "ui/notifications/tool-result") window.onToolResult(message.params);
  else if (message.method === "ui/notifications/host-context-changed") applyContext(message.params);
});
const connect = (name) => request("ui/initialize", { protocolVersion: "2025-06-18", appInfo: { name, version: "1.0.0" }, appCapabilities: {} })
  .then((result) => { applyContext(result && result.hostContext); notify("ui/notifications/initialized"); })
  .catch(() => {})
  .finally(() => { new ResizeObserver(reportSize).observe(document.body); reportSize(); });


const metrics = [["weightKg", "Weight", "kg"], ["bodyFatPercentage", "Body fat", "%"], ["waistCm", "Waist", "cm"], ["muscleMassKg", "Muscle", "kg"]];
let points = []; let metric = "weightKg";
const fmt = (n) => (Math.round(n * 10) / 10).toLocaleString();

function draw() {
  const [key, label, unit] = metrics.find((m) => m[0] === metric);
  const series = points.filter((p) => p[key] !== null && p[key] !== undefined).map((p) => ({ t: new Date(p.date).getTime(), v: Number(p[key]) })).sort((a, b) => a.t - b.t);
  const chart = document.getElementById("chart");
  chart.hidden = false;
  if (series.length === 0) { chart.replaceChildren(el("p", { class: "muted" }, `No ${label.toLowerCase()} measurements yet.`)); document.getElementById("summary").textContent = ""; return; }
  const first = series[0], last = series[series.length - 1];
  const change = last.v - first.v;
  document.getElementById("summary").textContent = `${label}: ${fmt(last.v)} ${unit} now` + (series.length > 1 ? `, ${change >= 0 ? "+" : ""}${fmt(change)} ${unit} since ${new Date(first.t).toISOString().slice(0, 10)}` : "");
  const w = 560, h = 180, pad = { l: 40, r: 10, t: 10, b: 22 };
  const min = Math.min(...series.map((s) => s.v)), max = Math.max(...series.map((s) => s.v));
  const span = max - min || 1, lo = min - span * 0.1, hi = max + span * 0.1;
  const x = (t) => pad.l + (series.length === 1 ? (w - pad.l - pad.r) / 2 : ((t - first.t) / (last.t - first.t || 1)) * (w - pad.l - pad.r));
  const y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * (h - pad.t - pad.b);
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`); svg.setAttribute("width", "100%"); svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `${label} from ${fmt(first.v)} to ${fmt(last.v)} ${unit}`);
  const add = (tag, attrs, text) => { const n = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text) n.textContent = text; svg.append(n); return n; };
  for (const v of [lo + (hi - lo) * 0.1, (lo + hi) / 2, hi - (hi - lo) * 0.1]) { add("line", { x1: pad.l, x2: w - pad.r, y1: y(v), y2: y(v), stroke: "var(--rule)" }); add("text", { x: pad.l - 6, y: y(v) + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }, fmt(v)); }
  add("polyline", { points: series.map((s) => `${x(s.t)},${y(s.v)}`).join(" "), fill: "none", stroke: "var(--teal)", "stroke-width": 2 });
  for (const s of series) add("circle", { cx: x(s.t), cy: y(s.v), r: 3, fill: "var(--teal)" }).append(Object.assign(document.createElementNS(ns, "title"), { textContent: `${new Date(s.t).toISOString().slice(0, 10)}: ${fmt(s.v)} ${unit}` }));
  add("text", { x: pad.l, y: h - 5, fill: "var(--muted)", "font-size": 11 }, new Date(first.t).toISOString().slice(0, 10));
  add("text", { x: w - pad.r, y: h - 5, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }, new Date(last.t).toISOString().slice(0, 10));
  chart.replaceChildren(svg);
}

function tabs() {
  const host = document.getElementById("metrics");
  host.hidden = false;
  host.replaceChildren(...metrics.filter(([key]) => points.some((p) => p[key] !== null && p[key] !== undefined)).map(([key, label]) =>
    el("button", { type: "button", "aria-pressed": String(key === metric), class: key === metric ? "primary" : "", onclick: () => { metric = key; tabs(); draw(); } }, label)));
}

window.onToolResult = (result) => {
  const data = jsonOf(result);
  const items = data && (data.items || data);
  if (result.isError || !Array.isArray(items)) { const m = document.getElementById("message"); m.className = "err"; m.textContent = textOf(result) || "No measurements."; return; }
  points = items;
  metric = metrics.find(([key]) => points.some((p) => p[key] !== null && p[key] !== undefined))?.[0] || "weightKg";
  tabs(); draw();
};
connect("Mizan body trend");

</script>
</body>
</html>
