
# Development Docker Compose for Mizan Platform
# Usage: docker-compose up

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: mizan-postgres
    environment:
      POSTGRES_DB: mizan
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mizan -d mizan" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mizan-network

  # Redis for SignalR backplane and caching
  redis:
    image: redis:7-alpine
    container_name: mizan-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?REDIS_PASSWORD is required} ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mizan-network

  # S3-compatible object storage for local development. Production points at
  # the MinIO already running on the VPS, so this service exists only so that
  # uploads can be exercised locally rather than silently falling back to the
  # unconfigured storage service.
  minio:
    image: minio/minio:latest
    container_name: mizan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mizan-network

  # Creates the bucket and opens it for reads, then exits. Without a public
  # read policy every image would come back as an expiring presigned URL.
  minio-init:
    image: minio/mc:latest
    container_name: mizan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 '${STORAGE_ACCESS_KEY_ID}' '${STORAGE_SECRET_ACCESS_KEY}' &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-mizan} &&
      mc anonymous set download local/${STORAGE_BUCKET:-mizan} &&
      echo 'bucket ready'
      "
    networks:
      - mizan-network

  # Next.js Frontend with Bun (Development with hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mizan-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      # No DATABASE_URL: the frontend owns no tables since v2.

      # Backend API (internal network - server-side)
      - API_URL=${SERVER_API_URL:-http://backend:8080}
      # The bot service, for the Mini App's POST /telegram/miniapp/session
      # (server-side; production routes that path to the bot at the proxy).
      - TELEGRAM_BOT_URL=${TELEGRAM_BOT_URL:-http://telegram:5002}

      # Public URLs
      - NEXT_PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:5000}
      - ALLOWED_DEV_ORIGINS=${ALLOWED_DEV_ORIGINS:-}

      # External services
      # Public origin of the object store, for next/image's host allowlist.
      - NEXT_PUBLIC_MEDIA_URL=${STORAGE_PUBLIC_BASE_URL:-}
      # OpenTelemetry (optional, no-op if endpoints not set)
      - OTLP_ENDPOINT_URL=${OTLP_ENDPOINT_URL:-}
      - LOKI_OTLP_ENDPOINT=${LOKI_OTLP_ENDPOINT:-}
      - OTEL_METRICS_PORT=9464
    depends_on:
      backend:
        condition: service_started
    networks:
      - mizan-network

  # .NET Backend API - owns identity and the schema
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mizan-backend
    # Exposed on 5000 for local development
    ports:
      - "5000:8080"
    volumes:
      - ./backend:/src
      # The Dockerfile's restore cache is a build-time mount, so a recreated
      # container starts with an empty package folder and `dotnet run` restores
      # the whole graph over the network again - slow, and dead in the water
      # whenever nuget.org is unreachable, which it repeatedly has been.
      # Sharing the host's cache means a restart reuses whatever `dotnet build`
      # on the host already downloaded, and needs no network at all.
      - ${NUGET_PACKAGES_DIR:-nuget_packages}:/root/.nuget/packages
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

      # Database
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=mizan;Username=mizan;Password=${DB_PASSWORD:?DB_PASSWORD is required}

      # Redis
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD is required}

      # Email, storage, AI, Telegram, push and billing are runtime settings in
      # Admin, Settings, not environment variables. To copy older .env values in
      # once, see docs/ADMIN.md#moving-settings-out-of-the-environment.
      - App__PublicUrl=${PUBLIC_APP_URL:-http://localhost:3000}
      - App__CookieDomain=${COOKIE_DOMAIN:-}
      - Cors__Origins__0=http://frontend:3000
      - Cors__Origins__1=http://localhost:3000
      - Cors__Origins__2=${PUBLIC_APP_URL:-http://localhost:3000}
      # MCP service-to-service API keys
      - Mcp__ServiceApiKey=${MCP_SERVICE_KEY:?MCP_SERVICE_KEY is required}
      - Mcp__AdminServiceApiKey=${MCP_ADMIN_SERVICE_KEY:?MCP_ADMIN_SERVICE_KEY is required}
      # The prices worker's Run now endpoint, called with the service key above.
      - Prices__WorkerUrl=${PRICES_WORKER_URL:-http://prices:5003}
      # OpenTelemetry (optional, no-op if endpoints not set)
      - OTLP_ENDPOINT_URL=${OTLP_ENDPOINT_URL:-}
      - LOKI_OTLP_ENDPOINT=${LOKI_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - mizan-network

  # MCP Server (Model Context Protocol over SSE)
  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    container_name: mizan-mcp
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      # Backend API connection (internal network)
      - BACKEND_API_URL=http://backend:8080
      # The web app, for the billing link in limit and upgrade messages
      - App__PublicUrl=${PUBLIC_APP_URL:-http://localhost:3000}
      # Service API keys for backend authentication
      - Mcp__ServiceApiKey=${MCP_SERVICE_KEY:?MCP_SERVICE_KEY is required}
      - Mcp__AdminServiceApiKey=${MCP_ADMIN_SERVICE_KEY:?MCP_ADMIN_SERVICE_KEY is required}
      # OpenTelemetry (optional, no-op if endpoints not set)
      - OTLP_ENDPOINT_URL=${OTLP_ENDPOINT_URL:-}
      - LOKI_OTLP_ENDPOINT=${LOKI_OTLP_ENDPOINT:-}
    volumes:
      - ./backend/Mizan.Mcp.Server/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - mizan-network

  # Telegram bot. Long polling by default, so no public hostname is needed in
  # development; production turns on Telegram.UseWebhook in Admin, Settings and
  # puts nginx in front of /telegram/webhook. Starts and idles until a token is
  # set there.
  telegram:
    build:
      context: ./backend
      dockerfile: Dockerfile.telegram
    container_name: mizan-telegram
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - TelegramBot__ApiUrl=http://backend:8080
      # The same non-admin service key the MCP server uses. It is an internal
      # credential on an internal network; the bot needs impersonation for the
      # linked user and nothing beyond it.
      - TelegramBot__ServiceApiKey=${MCP_SERVICE_KEY:?MCP_SERVICE_KEY is required}
      - TelegramBot__PublicUrl=${PUBLIC_APP_URL:-http://localhost:3000}
      # Whose X-Forwarded-For the Mini App session believes: the frontend's
      # route handler forwards the browser's address from inside Docker's
      # default bridge range. See docs/TELEGRAM.md#configure-and-run.
      - TelegramBot__TrustedProxies=${TELEGRAM_TRUSTED_PROXIES:-172.16.0.0/12}
    depends_on:
      backend:
        condition: service_started
    networks:
      - mizan-network

  # Prices worker. Scrapes the enabled scraper sources on their cron, posts
  # observations to the API and takes a Redis lock per source so a second
  # instance never crawls the same shop at the same time. Starts and idles
  # when the API URL or service key is missing.
  prices:
    build:
      context: .
      dockerfile: prices/Dockerfile
    container_name: mizan-prices
    ports:
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5003
      - Prices__ApiUrl=http://backend:8080
      # The same non-admin service key the MCP server and the bot use. The
      # worker impersonates nobody; it only reaches /api/internal/prices/*.
      - Prices__ServiceApiKey=${MCP_SERVICE_KEY:?MCP_SERVICE_KEY is required}
      - Prices__Redis=redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - mizan-network

  # Test runner service
  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mizan-test
    volumes:
      - ./backend:/src
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=mizan_test;Username=mizan;Password=${DB_PASSWORD:?DB_PASSWORD is required}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: dotnet test --logger "console;verbosity=normal"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mizan-network
    profiles:
      - test

networks:
  mizan-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  nuget_packages:
