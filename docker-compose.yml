
# Development Docker Compose for Mizan Platform
# Usage: docker-compose up

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: mizan-postgres
    environment:
      POSTGRES_DB: mizan
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mizan -d mizan" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mizan-network

  # Redis for SignalR backplane and caching
  redis:
    image: redis:7-alpine
    container_name: mizan-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?REDIS_PASSWORD is required} ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mizan-network

  # Next.js Frontend with Bun (Development with hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mizan-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      # No DATABASE_URL: the frontend owns no tables since v2.

      # Backend API (internal network - server-side)
      - API_URL=${SERVER_API_URL:-http://backend:8080}

      # Public URLs
      - NEXT_PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:5000}
      - ALLOWED_DEV_ORIGINS=${ALLOWED_DEV_ORIGINS:-}

      # External services
      # Public origin of the object store, for next/image's host allowlist.
      - NEXT_PUBLIC_MEDIA_URL=${STORAGE_PUBLIC_BASE_URL:-}
      # Paddle (sandbox)
      - NEXT_PUBLIC_PADDLE_ENV=${NEXT_PUBLIC_PADDLE_ENV:-sandbox}
      - NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN:-}
      - NEXT_PUBLIC_PADDLE_PRICE_PRO_MONTHLY=${NEXT_PUBLIC_PADDLE_PRICE_PRO_MONTHLY:-}
      # OpenTelemetry (optional, no-op if endpoints not set)
      - OTLP_ENDPOINT_URL=${OTLP_ENDPOINT_URL:-}
      - LOKI_OTLP_ENDPOINT=${LOKI_OTLP_ENDPOINT:-}
      - OTEL_METRICS_PORT=9464
    depends_on:
      backend:
        condition: service_started
    networks:
      - mizan-network

  # .NET Backend API - owns identity and the schema
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mizan-backend
    # Exposed on 5000 for local development
    ports:
      - "5000:8080"
    volumes:
      - ./backend:/src
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

      # Database
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=mizan;Username=mizan;Password=${DB_PASSWORD:?DB_PASSWORD is required}

      # Redis
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD is required}

      # Identity - session cookies, email, OAuth
      - App__PublicUrl=${PUBLIC_APP_URL:-http://localhost:3000}
      # The bot's @name, so the API can build a working t.me deep link. Empty
      # hides the Telegram settings page entirely.
      - Telegram__BotUsername=${TELEGRAM_BOT_USERNAME:-}
      - App__CookieDomain=${COOKIE_DOMAIN:-}
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USER:-}
      - Smtp__Password=${SMTP_PASS:-}
      - Smtp__FromAddress=${SMTP_FROM:-noreply@mizan.local}
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      - Authentication__GitHub__ClientId=${GITHUB_CLIENT_ID:-}
      - Authentication__GitHub__ClientSecret=${GITHUB_CLIENT_SECRET:-}
      # Object storage - any S3-compatible endpoint (MinIO, Cloudflare R2)
      - Storage__ServiceUrl=${STORAGE_SERVICE_URL:-}
      - Storage__Region=${STORAGE_REGION:-auto}
      - Storage__AccessKeyId=${STORAGE_ACCESS_KEY_ID:-}
      - Storage__SecretAccessKey=${STORAGE_SECRET_ACCESS_KEY:-}
      - Storage__Bucket=${STORAGE_BUCKET:-mizan}
      - Storage__PublicBaseUrl=${STORAGE_PUBLIC_BASE_URL:-}
      - Cors__Origins__0=http://frontend:3000
      - Cors__Origins__1=http://localhost:3000
      - Cors__Origins__2=${PUBLIC_APP_URL:-http://localhost:3000}
      # AI platform. One OpenAI-compatible endpoint; the model is config.
      - Ai__BaseUrl=${AI_BASE_URL:-}
      - Ai__ApiKey=${AI_API_KEY:-}
      - Ai__Model=${AI_MODEL:-gpt-5.6-luna}
      - Ai__SupportsTemperature=${AI_SUPPORTS_TEMPERATURE:-true}
      - Ai__GlobalDailyTokens=${AI_GLOBAL_DAILY_TOKENS:-5000000}
      - Ai__GlobalDailyCostMicros=${AI_GLOBAL_DAILY_COST_MICROS:-20000000}
      # MCP service-to-service API keys
      - Mcp__ServiceApiKey=${MCP_SERVICE_KEY:?MCP_SERVICE_KEY is required}
      - Mcp__AdminServiceApiKey=${MCP_ADMIN_SERVICE_KEY:?MCP_ADMIN_SERVICE_KEY is required}
      # OpenTelemetry (optional, no-op if endpoints not set)
      - OTLP_ENDPOINT_URL=${OTLP_ENDPOINT_URL:-}
      - LOKI_OTLP_ENDPOINT=${LOKI_OTLP_ENDPOINT:-}
      # Paddle (sandbox)
      - Paddle__Environment=${PADDLE_ENVIRONMENT:-sandbox}
      - Paddle__ApiKey=${PADDLE_API_KEY:-}
      - Paddle__WebhookSecret=${PADDLE_WEBHOOK_SECRET:-}
      - Paddle__GraceDays=${PADDLE_GRACE_DAYS:-3}
      # No longer sold - kept only so a webhook replay for an existing
      # lifetime customer still resolves correctly. Set by hand if ever needed.
      - Paddle__LifetimePriceId=${PADDLE_PRICE_LIFETIME_LEGACY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mizan-network

  # MCP Server (Model Context Protocol over SSE)
  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    container_name: mizan-mcp
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=mizan;Username=mizan;Password=${DB_PASSWORD:?DB_PASSWORD is required}
      # Backend API connection (internal network)
      - BACKEND_API_URL=http://backend:8080
      # Service API keys for backend authentication
      - Mcp__ServiceApiKey=${MCP_SERVICE_KEY:?MCP_SERVICE_KEY is required}
      - Mcp__AdminServiceApiKey=${MCP_ADMIN_SERVICE_KEY:?MCP_ADMIN_SERVICE_KEY is required}
      # OpenTelemetry (optional, no-op if endpoints not set)
      - OTLP_ENDPOINT_URL=${OTLP_ENDPOINT_URL:-}
      - LOKI_OTLP_ENDPOINT=${LOKI_OTLP_ENDPOINT:-}
    volumes:
      - ./backend/Mizan.Mcp.Server/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - mizan-network

  # Telegram bot. Long polling by default, so no public hostname is needed in
  # development; production sets TELEGRAM_USE_WEBHOOK and puts nginx in front
  # of /telegram/webhook. Starts and idles when no token is configured.
  telegram:
    build:
      context: ./backend
      dockerfile: Dockerfile.telegram
    container_name: mizan-telegram
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - TelegramBot__BotToken=${TELEGRAM_BOT_TOKEN:-}
      - TelegramBot__UseWebhook=${TELEGRAM_USE_WEBHOOK:-false}
      - TelegramBot__WebhookSecret=${TELEGRAM_WEBHOOK_SECRET:-}
      - TelegramBot__ApiUrl=http://backend:8080
      # The same non-admin service key the MCP server uses. It is an internal
      # credential on an internal network; the bot needs impersonation for the
      # linked user and nothing beyond it.
      - TelegramBot__ServiceApiKey=${MCP_SERVICE_KEY:?MCP_SERVICE_KEY is required}
      - TelegramBot__PublicUrl=${PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_started
    networks:
      - mizan-network

  # Test runner service
  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mizan-test
    volumes:
      - ./backend:/src
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=mizan_test;Username=mizan;Password=${DB_PASSWORD:?DB_PASSWORD is required}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: dotnet test --logger "console;verbosity=normal"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mizan-network
    profiles:
      - test

networks:
  mizan-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
